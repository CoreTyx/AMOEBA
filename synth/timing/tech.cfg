# Knobs for the calibrated timing flow.  One "NAME value" pair per line; read
# by tech.tcl and gen_blackbox_libs.py.  Any of them can be overridden from the
# environment (e.g. `make timing TARGET_FO4_PS=45`).
#
# EVERY TIME HERE IS IN 65 nm NANOSECONDS.  The flow converts to the library it
# actually synthesizes with; nothing below should be pre-scaled by hand.

# Target clock: 400 MHz.
PERIOD_NS             2.5

# FO4 of the real target library at its signoff corner.  PLACEHOLDER for TSMC
# 65GP at SS / 0.9 V / 125 C: about 26 ps typical times about 1.5 for the slow
# corner.  Replace it with the number `dc_shell -f fo4.tcl` prints when
# STD_CELL_LIB points at the real .db -- that one measurement removes the
# largest uncertainty in every result this flow reports.
TARGET_FO4_PS         40

# Pre-CTS jitter + skew budget, as a fraction of the period.
CLK_UNCERTAINTY_FRAC  0.10

# SRAM macros (rf_sp_*): PLACEHOLDERS until the compiler datasheets are in hand.
SRAM_TACC_NS          0.80
SRAM_TSU_NS           0.20
SRAM_TH_NS            0.05

# Pad cells (io_in / io_out / io_tri): PLACEHOLDERS for the 65 nm pad library.
PAD_IN_NS             0.50
PAD_OUT_NS            1.50

# Board-side budgets, as fractions of the period.  The link shares core_clk in
# forte_top, so at 400 MHz these are a statement of intent, not of what the FPGA
# can do -- link paths get their own report group so they cannot hide the core.
LINK_IN_DELAY_FRAC    0.25
LINK_OUT_DELAY_FRAC   0.25

# fault_inject is a synchronous pad input until it has a synchroniser.  Set
# FI_SYNCHRONISED to 1 once it does and the port becomes a false path.
FI_IN_DELAY_FRAC      0.40
FI_SYNCHRONISED       0
