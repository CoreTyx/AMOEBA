# Linux userspace tier: every program in testcode/linux/userland gets its OWN
# Linux boot, all in parallel.
#
# One image is built per run (job `image`): kernel + OpenSBI + an initramfs
# holding every program.  Its command line carries a fixed-width slot,
# `amoeba_prog=________________` (testcode/linux/Makefile PROG_SLOT); each
# matrix job rewrites that slot with its program's name (bin/patch_bootarg.py,
# seconds, no rebuild) and /init then runs only that program.  So a failure is
# attributed to exactly one program, and no program's runtime delays another's
# verdict: total wall time is one boot (~420M cycles) plus the slowest program,
# instead of one boot plus all of them.
#
# The image is built inside this workflow rather than taken from
# linux-image.yml: on a pull request both would start together, and the boots
# would race the image build.
#
# Schedules: nightly on the legacy DUT; weekly on the ASIC top (DUT=forte,
# through the 8+8 link model with random ready/rvalid gaps).
name: Linux Userspace (per-program boots)

on:
  schedule:
    - cron: '0 9 * * *'      # nightly, legacy DUT
    - cron: '0 3 * * 6'      # weekly (Saturday), ASIC top with link gaps
  workflow_dispatch:
    inputs:
      dut:
        description: DUT to boot
        type: choice
        options: [legacy, forte]
        default: legacy
      progs:
        description: space-separated subset of PROGS (empty = all)
        default: ''
  pull_request:
    branches: [main]
    paths:
      - 'testcode/linux/**'
      - 'bin/linux_image_to_lst.py'
      - 'bin/patch_bootarg.py'
      - '.github/workflows/linux-userspace.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-userspace-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DUT: ${{ inputs.dut || (github.event.schedule == '0 3 * * 6' && 'forte') || 'legacy' }}

jobs:
  image:
    name: Build boot image (Linux 6.6 + OpenSBI 1.4 + all programs)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      progs: ${{ steps.p.outputs.progs }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 gcc g++ make curl xz-utils \
            bc bison flex libssl-dev libelf-dev device-tree-compiler cpio
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: testcode/linux/build/dl
          key: linux-dl-${{ hashFiles('testcode/linux/Makefile') }}
      - name: Build boot image
        run: make -C testcode/linux
      - name: Program list
        id: p
        run: |
          progs="${{ inputs.progs }}"
          [ -n "$progs" ] || progs=$(make -s -C testcode/linux list-progs)
          json=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$progs")
          echo "progs=$json" >> "$GITHUB_OUTPUT"
          echo "programs: $json"
      - name: Provenance
        run: |
          cd testcode/linux/build
          sha256sum boot.lst amoeba.dtb > boot.sha256
          { echo "linux:   6.6"; echo "opensbi: 1.4"; echo "commit:  ${GITHUB_SHA}"; } > boot.provenance
          grep -c . boot.lst
      - uses: actions/upload-artifact@v4
        with:
          name: userspace-boot-image
          path: |
            testcode/linux/build/boot.lst
            testcode/linux/build/boot.sha256
            testcode/linux/build/boot.provenance
          retention-days: 7
          compression-level: 9

  sim:
    name: Build Linux simulator (${{ inputs.dut || (github.event.schedule == '0 3 * * 6' && 'forte') || 'legacy' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/setup-sim
      - name: Cache Linux simulator
        id: cache
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_linux${{ env.DUT == 'forte' && '_forte' || '' }}
          key: linux-sim-${{ env.DUT }}-${{ runner.os }}-${{ github.sha }}
      - name: Compile
        if: steps.cache.outputs.cache-hit != 'true'
        run: make -C sim build_linux DUT=$DUT

  boot:
    name: ${{ matrix.prog }}
    needs: [image, sim]
    runs-on: ubuntu-latest
    # one boot (~420M cycles) plus one program, under the 6 h job ceiling
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        prog: ${{ fromJson(needs.image.outputs.progs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/setup-sim
      - uses: actions/cache/restore@v4
        with:
          path: sim/verilator/build_linux${{ env.DUT == 'forte' && '_forte' || '' }}
          key: linux-sim-${{ env.DUT }}-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: touch sim/verilator/build_linux${{ env.DUT == 'forte' && '_forte' || '' }}/Vtop_tb
      - uses: actions/download-artifact@v4
        with:
          name: userspace-boot-image
          path: testcode/linux/build
      - name: Select ${{ matrix.prog }} in the image
        run: python3 bin/patch_bootarg.py testcode/linux/build/boot.lst testcode/linux/build/boot_${{ matrix.prog }}.lst ${{ matrix.prog }}
      # LINUX_FAIL adds /init's failure line, so a failing program ends the run
      # at once instead of at the timeout.  900M cycles: ~420M to the shell,
      # the heaviest program is well under 100M; ~1.8x headroom.
      - name: Boot and run ${{ matrix.prog }}
        run: |
          link=""
          [ "$DUT" = forte ] && link="+LINK_GAPS=1 +LINK_SEED=$(( $(echo -n '${{ matrix.prog }}' | cksum | cut -d' ' -f1) % 1000 ))"
          make -C sim linux_boot DUT=$DUT LINK_ARGS="$link" \
            LINUX_MEMLST=$PWD/testcode/linux/build/boot_${{ matrix.prog }}.lst \
            LINUX_RUN_DIR=verilator/linux_${{ matrix.prog }} \
            LINUX_TIMEOUT=900000000 \
            LINUX_PASS=AMOEBA_LINUX_PROGS_OK \
            LINUX_FAIL='Kernel panic|Unable to handle kernel|Oops:|SBI panic|AMOEBA_PROG_FAIL|Kernel BUG|BUG:'
      - name: Program output
        if: always()
        run: grep -E 'AMOEBA_|PROG|COUNTER' sim/verilator/linux_${{ matrix.prog }}/boot_uart.log || true
      - name: Milestone timing report
        if: always()
        run: python3 testcode/linux/boot_report.py sim/verilator/linux_${{ matrix.prog }}/simulation.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-userspace-${{ matrix.prog }}-${{ env.DUT }}
          path: |
            sim/verilator/linux_${{ matrix.prog }}/simulation.log
            sim/verilator/linux_${{ matrix.prog }}/boot_uart.log
          retention-days: 14
