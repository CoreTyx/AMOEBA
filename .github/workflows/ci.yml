name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build with Spike DPI ────────────────────────────────────────────────────
  ci-build-spike:
    name: Build (Spike DPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Build spike.so
        run: g++ -shared -fPIC -O2 hvl/common/spike_dpi.cpp -o hvl/common/spike.so

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Check generated files are up to date
        run: make -C sim check-generated

      - name: Compile (Spike DPI)
        run: PATH=/opt/verilator/bin:$PATH make -C sim verilator/build/Vtop_tb

      - name: Cache Spike DPI build
        uses: actions/cache@v4
        with:
          path: sim/verilator/build
          key: spike-build-${{ runner.os }}-${{ github.sha }}

  # ── Build without Spike DPI (ISA-level tests and FreeRTOS tests) ────────────
  ci-build-no-spike:
    name: Build (No Spike DPI — ISA & FreeRTOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Compile (No Spike DPI)
        run: PATH=/opt/verilator/bin:$PATH make -C sim build_isa_tests

      - name: Cache no-spike build
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_no_spike
          key: no-spike-build-${{ runner.os }}-${{ github.sha }}

  # ── FT 64-bit module tests (three thresholds) and core integration ──
  ci-ft-shadow:
    name: Fault-Tolerant Unit and Core Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 gcc g++ make autoconf flex bison libfl-dev help2man zlib1g-dev

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Run 64-bit module tests at mismatch thresholds 1, 2, 3
        run: PATH=/opt/verilator/bin:$PATH make -C sim ft_shadow_regression

      - name: Run per-unit fault-control register tests
        run: PATH=/opt/verilator/bin:$PATH make -C sim ft_control_test

      - name: Run independent core fault integration test
        run: PATH=/opt/verilator/bin:$PATH make -C sim ft_core_test

  # ── Discover all baremetal tests ────────────────────────────────────────────
  ci-discover-tests:
    name: Discover Baremetal Tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover baremetal tests
        id: discover
        run: |
          TESTS=$(find testcode/baremetal -name "*.c" -type f | sed 's|testcode/baremetal/||g' | sed 's|\.c$||g' | jq -R -s -c 'split("\n")[:-1]')
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT

  # ── Discover all ISA-level tests ─────────────────────────────────────────────
  ci-discover-isa-tests:
    name: Discover ISA-Level Tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover ISA-level tests
        id: discover
        run: |
          # tcf_* are forte-only: they exercise hardware that exists only in
          # the ASIC hierarchy, and this matrix runs the DEFAULT DUT (legacy).
          # The ci-forte job below runs them.  Excluded by prefix rather than by
          # name so adding the next one needs no edit here.
          TESTS=$(find testcode/isa_level_testing -name "*.c" -type f ! -name "test_utils.h" ! -name "tcf_*.c" | sed 's|testcode/isa_level_testing/||g' | sed 's|\.c$||g' | jq -R -s -c 'split("\n")[:-1]')
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT

  # ── Discover all FreeRTOS tests ──────────────────────────────────────────────
  ci-discover-freertos-tests:
    name: Discover FreeRTOS Tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover FreeRTOS tests
        id: discover
        run: |
          TESTS=$(find testcode/freertos -name "tc_*.c" -type f | sed 's|testcode/freertos/||g' | sed 's|\.c$||g' | jq -R -s -c 'split("\n")[:-1]')
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT

  # ── Build Spike executable (shared for baremetal tests) ────────────────────
  ci-build-spike-exe:
    name: Build Spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf flex bison libfl-dev help2man zlib1g-dev \
            device-tree-compiler
          pip3 install --quiet pyyaml

      - name: Cache Spike executable
        id: cache-spike
        uses: actions/cache@v4
        with:
          path: /tmp/spike-install
          key: spike-commitlog-${{ runner.os }}-v1.1.0

      - name: Build Spike from source
        if: steps.cache-spike.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/riscv-software-src/riscv-isa-sim.git --branch v1.1.0 /tmp/spike-src
          # Fix missing <cstdint> include in v1.1.0
          sed -i '9i #include <cstdint>' /tmp/spike-src/fesvr/device.h
          mkdir /tmp/spike-src/build
          cd /tmp/spike-src/build
          ../configure --enable-commitlog --prefix=/tmp/spike-install
          make -j$(nproc)
          make install

  # ── ISA-level regression: run tests with no-spike simulator ─────────────────
  ci-isa-level:
    name: ISA-Level - ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: [ci-discover-isa-tests, ci-build-no-spike]
    strategy:
      matrix:
        test: ${{ fromJson(needs.ci-discover-isa-tests.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev \
            gcc-riscv64-unknown-elf device-tree-compiler
          pip3 install --quiet pyyaml

      - name: Restore no-spike build cache
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_no_spike
          key: no-spike-build-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Touch Vtop_tb to prevent timestamp-triggered rebuild
        run: touch sim/verilator/build_no_spike/Vtop_tb

      - name: Run ISA-level test
        run: make -C sim run_verilator_top_tb_no_spike PROG=../testcode/isa_level_testing/${{ matrix.test }}.c

  # ── The ASIC top ───────────────────────────────────────────────────────────
  # Nothing else in this file builds DUT=forte, and that gap has already cost
  # real time: the link was hardcoded to INCR8, a cache-line resize made that
  # silently wrong, and tc_compressed/tc_insert_trace hung on the ASIC top while
  # every job here stayed green because they all run the legacy DUT.
  #
  # One job rather than a matrix: the forte build is the expensive part and the
  # tests are quick once it exists.  make cdc is the two-clock CDC run
  # (docs/impl_plan_link_clocking.md s9a) -- without it the async FIFOs' Gray
  # pointers are never exercised at a non-integer ratio, because forte_top ties
  # link_clk to core_clk and RTL simulation then sees zero skew.  The six-ratio
  # sweep (make cdc_sweep) is deliberately NOT here; it belongs in a nightly.
  ci-forte:
    name: ASIC top (DUT=forte)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev \
            gcc-riscv64-unknown-elf device-tree-compiler
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      # Includes the tcf_* forte-only tests, via sim/Makefile's prefix split.
      - name: ISA regression on the ASIC top
        run: make -C sim isa_regression DUT=forte TIMEOUT=4000000

      # Gated on aborted != 0, so it fails if the abort path stops being
      # exercised rather than silently proving nothing.
      - name: Link abort torture
        run: make -C sim link_abort DUT=forte

      - name: Two-clock CDC run
        run: make -C sim cdc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forte-logs
          path: sim/verilator/tc_*/simulation.log
          retention-days: 14

  # ── Baremetal regression: run tests with cached Spike DPI simulator ────────
  ci-baremetal:
    name: Baremetal - ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: [ci-discover-tests, ci-build-spike, ci-build-spike-exe]
    strategy:
      matrix:
        test: ${{ fromJson(needs.ci-discover-tests.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev \
            gcc-riscv64-unknown-elf device-tree-compiler libboost-regex-dev libboost-system-dev
          pip3 install --quiet pyyaml

      - name: Build spike.so
        run: g++ -shared -fPIC -O2 hvl/common/spike_dpi.cpp -o hvl/common/spike.so

      - name: Restore Spike executable cache
        uses: actions/cache@v4
        with:
          path: /tmp/spike-install
          key: spike-commitlog-${{ runner.os }}-v1.1.0
          fail-on-cache-miss: true

      - name: Add Spike to PATH
        run: echo "/tmp/spike-install/bin" >> $GITHUB_PATH

      - name: Restore Spike DPI build cache
        uses: actions/cache@v4
        with:
          path: sim/verilator/build
          key: spike-build-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Touch Vtop_tb to prevent timestamp-triggered rebuild
        run: touch sim/verilator/build/Vtop_tb

      - name: Run baremetal test
        run: make -C sim run_verilator_top_tb PROG=../testcode/baremetal/${{ matrix.test }}.c

  # ── FreeRTOS regression: matrix over tc_*.c test programs ───────────────────
  ci-freertos:
    name: FreeRTOS - ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: [ci-discover-freertos-tests, ci-build-no-spike, ci-baremetal, ci-isa-level]
    strategy:
      matrix:
        test: ${{ fromJson(needs.ci-discover-freertos-tests.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev \
            gcc-riscv64-unknown-elf
          pip3 install --quiet pyyaml

      - name: Fetch FreeRTOS-Kernel submodule
        run: git submodule update --init third_party/FreeRTOS-Kernel

      - name: Restore no-spike build cache
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_no_spike
          key: no-spike-build-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Touch Vtop_tb to prevent timestamp-triggered rebuild
        run: touch sim/verilator/build_no_spike/Vtop_tb

      - name: Build FreeRTOS test ELF
        run: make -C testcode/freertos build PROG=$(pwd)/testcode/freertos/${{ matrix.test }}.c

      - name: Run FreeRTOS test
        run: make -C sim run_verilator_top_tb_no_spike PROG=$(pwd)/testcode/freertos/freertos_wally.elf

  # ── ECC unit tests (pure combinational enc/dec self-check) ──────────────────
  ci-ecc-unit:
    name: ECC Unit Tests (enc/dec standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Run ECC enc/dec unit test
        run: PATH=/opt/verilator/bin:$PATH make -C sim ecc_secded_dected_test

      - name: Run CSR hardening unit test
        run: PATH=/opt/verilator/bin:$PATH make -C sim csr_harden_test

  # ── Build ECC inject simulator (ECE411_SIM_INJECT) ──────────────────────────
  ci-build-ecc-inject:
    name: Build (ECC Inject Sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Compile (ECC Inject)
        run: PATH=/opt/verilator/bin:$PATH make -C sim verilator/build_ecc_inject/Vtop_tb

      - name: Cache ECC inject build
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_ecc_inject
          key: ecc-inject-build-${{ runner.os }}-${{ github.sha }}

  # ── Discover ECC baremetal tests ─────────────────────────────────────────────
  ci-discover-ecc-tests:
    name: Discover ECC Baremetal Tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover ECC baremetal tests
        id: discover
        run: |
          TESTS=$(find testcode/baremetal_ecc -name "*.c" -type f | sed 's|testcode/baremetal_ecc/||g' | sed 's|\.c$||g' | jq -R -s -c 'split("\n")[:-1]')
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT

  # ── ECC baremetal regression: matrix over tc_ecc_*.c with inject_en=1 ───────
  ci-baremetal-ecc:
    name: ECC Baremetal - ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: [ci-discover-ecc-tests, ci-build-ecc-inject]
    strategy:
      matrix:
        test: ${{ fromJson(needs.ci-discover-ecc-tests.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev \
            gcc-riscv64-unknown-elf device-tree-compiler
          pip3 install --quiet pyyaml

      - name: Restore ECC inject build cache
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_ecc_inject
          key: ecc-inject-build-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Touch Vtop_tb to prevent timestamp-triggered rebuild
        run: touch sim/verilator/build_ecc_inject/Vtop_tb

      - name: Run ECC baremetal test with shared ECC/FT injection (fault_inject=1)
        run: make -C sim run_ecc_inject PROG=../testcode/baremetal_ecc/${{ matrix.test }}.c

  # ── Build Linux + ECC inject simulator ──────────────────────────────────────
  ci-build-linux-ecc-inject:
    name: Build (Linux + ECC Inject Sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Compile (Linux + ECC Inject)
        run: PATH=/opt/verilator/bin:$PATH make -C sim verilator/build_linux_ecc_inject/Vtop_tb

      - name: Cache Linux+ECC inject build
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_linux_ecc_inject
          key: linux-ecc-inject-build-${{ runner.os }}-${{ github.sha }}

  # ── Linux boot with ECC injection ────────────────────────────────────────────
  # Runs in parallel to the plain Linux boot (if added later).  Gate: all ECC
  # unit tests, all ECC baremetal tests, and all plain baremetal tests must pass
  # before we trust the simulator enough to attempt a full Linux boot under
  # continuous LFSR bit-flip injection.
  ci-linux-boot-ecc-inject:
    name: Linux Boot with ECC Inject
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      # For the changed-file check in .github/scripts/download_boot_image.sh.
      # This job's permissions are declared locally, so it does NOT inherit the
      # ones linux-boot.yml sets -- which is exactly why fixing that workflow
      # alone left this one failing.
      pull-requests: read
    needs:
      - ci-ecc-unit
      - ci-baremetal-ecc
      - ci-baremetal
      - ci-build-linux-ecc-inject
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Download boot image
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/download_boot_image.sh

      - name: Show image provenance
        run: |
          echo "Boot image built from branch: ${LINUX_IMAGE_FROM:-unknown}"
          cat testcode/linux/build/boot.provenance

      - name: Restore Linux+ECC inject build cache
        uses: actions/cache@v4
        with:
          path: sim/verilator/build_linux_ecc_inject
          key: linux-ecc-inject-build-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Touch Vtop_tb to prevent timestamp-triggered rebuild
        run: touch sim/verilator/build_linux_ecc_inject/Vtop_tb

      - name: Boot Linux with shared ECC/FT injection
        run: |
          make -C sim linux_boot_ecc_inject \
            LINUX_TIMEOUT=800000000

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ecc-inject-boot-logs
          path: |
            sim/verilator/linux_ecc_inject_boot/simulation.log
            sim/verilator/linux_ecc_inject_boot/boot_uart.log
          retention-days: 14
