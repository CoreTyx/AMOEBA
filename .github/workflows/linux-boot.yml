# Nightly Linux boot test.
#
# Boots Linux 6.6 on the CVW core under Verilator and requires that PID 1 print
# its magic string over the SoC UART.
#
# Budget, measured on a 20-core desktop: 353,555,362 cycles in 3,187 s at
# 110.9 kHz.  A GitHub-hosted runner has fewer, slower cores, so assume 2-4x and
# budget accordingly -- but the whole run must still fit inside GitHub's hard
# 6-hour job ceiling, which is why the image is built by a separate workflow and
# downloaded here rather than built in this job.
name: Linux Boot (nightly)

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      milestone:
        description: 'UART string that ends the run (see testcode/linux/README.md)'
        required: false
        default: 'AMOEBA_LINUX_BOOT_OK'
  # Runs the full boot against a PR before it can reach main.  The job is hours
  # long and re-fires on every push to the PR, which is acceptable because a
  # boot regression is otherwise only caught by the nightly, after the change
  # has already landed.  Paths are limited to what the boot actually depends
  # on: the image sources, the core, the testbench and the simulation makefile.
  pull_request:
    branches: [main]
    paths:
      - 'testcode/linux/**'
      - 'bin/linux_image_to_lst.py'
      - 'hdl/**'
      - 'hvl/**'
      - 'sim/Makefile'
      - '.github/workflows/linux-boot.yml'

# gh run list / gh run download need actions:read.  A repository whose default
# token is contents-only would otherwise fail at the download step.
# pull-requests:read is for the changed-file check in "Download boot image".
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  boot:
    name: Boot to userspace
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch riscv-formal submodule
        run: git submodule update --init third_party/riscv-formal

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            autoconf flex bison libfl-dev help2man zlib1g-dev
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      # Built by .github/workflows/linux-image.yml.  Building a kernel here would
      # cost 10-30 minutes of the simulation budget.
      - name: Download boot image
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p testcode/linux/build

          # THE BRANCH SCOPING IS CONDITIONAL, AND THAT IS THE POINT.
          #
          # An unscoped lookup takes the newest success on any branch, so a PR
          # that edits the kernel could silently boot main's kernel and prove
          # nothing about the change under review.  That is why this was scoped.
          #
          # But the image is built from testcode/linux/** and
          # bin/linux_image_to_lst.py and NOTHING ELSE, so a PR that touches
          # neither cannot affect it, and for those the default branch's image is
          # the same image.  Scoping unconditionally made this job permanently red
          # on every hardware-only PR -- which is most of them, since the
          # pull_request trigger above fires on hdl/**, hvl/** and sim/Makefile.
          # A job that always fails for a reason unrelated to the change is a job
          # people learn to ignore, which is worse than one that is occasionally
          # too permissive.
          #
          # So: prefer this branch's own image; fall back to the default branch
          # ONLY when this ref leaves the image sources alone; and refuse when it
          # changes them, because then the fallback would be a different kernel.
          #
          # GITHUB_HEAD_REF is set only for pull_request events; GITHUB_REF_NAME
          # covers schedule and workflow_dispatch.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          find_image () {   # $1 = branch name, prints a run id or nothing
            gh run list --repo "$GITHUB_REPOSITORY" --branch "$1" \
              --workflow linux-image.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId'
          }

          echo "Looking for a boot image built from branch: $BRANCH"
          RUN_ID=$(find_image "$BRANCH")
          IMAGE_FROM="$BRANCH"

          if [ -z "$RUN_ID" ]; then
            if [ -n "${PR_NUMBER:-}" ]; then
              # Fetched, then filtered, in two steps on purpose: piping gh into
              # grep under `set -o pipefail` with a `|| true` would swallow a gh
              # API failure and read it as "nothing changed", which is exactly
              # the direction that must not fail open.
              FILES=$(gh api --paginate \
                        "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                        --jq '.[].filename')
              CHANGED=$(printf '%s\n' "$FILES" \
                        | grep -E '^(testcode/linux/|bin/linux_image_to_lst\.py$)' || true)
            else
              # Not a pull request, so there is no base to compare against and no
              # safe fallback: a scheduled or dispatched run must have its own.
              CHANGED="(not a pull request)"
            fi

            if [ -n "$CHANGED" ]; then
              echo "No successful linux-image.yml run on branch '$BRANCH', and this"
              echo "ref changes the image sources, so another branch's image would"
              echo "not represent it.  Changed:"
              printf '  %s\n' "$CHANGED"
              echo "Run Actions -> Linux Boot Image -> Run workflow against"
              echo "'$BRANCH', then re-run this job."
              exit 1
            fi

            FALLBACK="${DEFAULT_BRANCH:-main}"
            echo "::notice::No boot image for '$BRANCH', and it does not touch the image sources, so falling back to '$FALLBACK'."
            RUN_ID=$(find_image "$FALLBACK")
            IMAGE_FROM="$FALLBACK"
            if [ -z "$RUN_ID" ]; then
              echo "No successful linux-image.yml run on '$FALLBACK' either, so"
              echo "there is no image anywhere to boot.  Run Actions -> Linux Boot"
              echo "Image -> Run workflow."
              exit 1
            fi
          fi

          echo "Using boot image from branch '$IMAGE_FROM' (run $RUN_ID)"
          echo "LINUX_IMAGE_FROM=$IMAGE_FROM" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name amoeba-linux-boot-image --dir testcode/linux/build
          ls -la testcode/linux/build

      - name: Show image provenance
        run: |
          echo "Boot image built from branch: ${LINUX_IMAGE_FROM:-unknown}"
          cat testcode/linux/build/boot.provenance

      - name: Build Linux boot simulator
        run: make -C sim build_linux

      # Cheap pre-flight: proves the UART tap, the .lst loader and the pass
      # matcher all work before committing hours to a boot.
      - name: Console-path smoke test
        run: |
          make -C testcode/linux smoke
          make -C sim linux_boot \
            LINUX_MEMLST=$PWD/testcode/linux/build/uart_smoke.lst \
            LINUX_PASS=AMOEBA_UART_OK LINUX_TIMEOUT=400000

      # 800M cycles is ~2.3x the measured 353.5M, so a genuine hang fails in
      # reasonable time instead of burning to the job ceiling.
      - name: Boot Linux
        # The milestone goes through env rather than being interpolated into the
        # script: inside a block scalar there is no YAML quote escaping, so a
        # nested quote in a GitHub expression is a parse error, and the value
        # would also be re-parsed by the shell.
        env:
          MILESTONE: ${{ github.event.inputs.milestone || 'AMOEBA_LINUX_BOOT_OK' }}
        run: |
          make -C sim linux_boot \
            LINUX_TIMEOUT=800000000 \
            LINUX_PASS="$MILESTONE"

      - name: Milestone timing report
        if: always()
        run: |
          python3 testcode/linux/boot_report.py \
            sim/verilator/linux_boot/simulation.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-boot-logs
          path: |
            sim/verilator/linux_boot/simulation.log
            sim/verilator/linux_boot/boot_uart.log
          retention-days: 14
